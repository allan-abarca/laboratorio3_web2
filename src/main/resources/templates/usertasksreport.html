<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>JustDoIt! - Reporte de tareas</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>
    <div class="container">

        <aside class="sidebar">
            <div class="logo">
                <a th:href="@{/}"><img th:src="@{/images/JustDoIt.png}" alt="JustDoIt Logo" width="200" height="200"></a>
            </div>

            <nav class="navigation">
                <h3>Tareas</h3>
                <ul>
                    <li><a th:href="@{/user/tasks}">Tareas de usuario actual</a></li>
                    <li><a th:href="@{/user/tasks/report}">Reporte de tareas</a></li>
                </ul>
            </nav>
        </aside>

        <main class="content">
            <h1>Reporte de tareas del usuario</h1>

            <div th:replace="fragments/user-info :: userInfo"></div>

            <table border="1" cellpadding="6" style="border-collapse: collapse;">
                <tr>
                    <th>Tarea</th>
                    <th>Estado</th>
                    <th>Fecha Límite</th>
                </tr>
                <tr th:each="task : ${user.tasks}">
                    <td th:text="${task.description}">Descripción</td>
                    <td th:switch="${task.status.name()}">
                        <span th:case="'PENDING'">Pendiente</span>
                        <span th:case="'INPROGRESS'">En progreso</span>
                        <span th:case="'DONE'">Completada</span>
                    </td>
                    <td th:text="${task.deadline != null} ? ${task.deadline} : 'No especificada'">Fecha</td>
                </tr>
            </table>
        </main>
    </div>
</body>
</html>
